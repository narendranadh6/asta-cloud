# Generate Halo.xcodeproj with XcodeGen:  brew install xcodegen && xcodegen generate
name: Halo
options:
  bundleIdPrefix: app.halo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Team ID for device builds / TestFlight
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configs:
  Debug: debug
  Release: release
targets:
  Halo:
    type: application
    platform: iOS
    sources:
      - path: Halo
        excludes:
          - "App/Info.plist"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.halo.ios
        INFOPLIST_FILE: Halo/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  HaloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HaloCoreTests
        excludes:
          - "Fixtures"
      - path: Tests/HaloCoreTests/Fixtures
        type: folder
        buildPhase: resources
      - path: Tests/HaloTests
    dependencies:
      - target: Halo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.halo.ios.tests
  HaloUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/HaloUITests
    dependencies:
      - target: Halo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.halo.ios.uitests
        TEST_TARGET_NAME: Halo
schemes:
  Halo:
    build:
      targets:
        Halo: all
        HaloTests: [test]
        HaloUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [HaloTests, HaloUITests]
      gatherCoverageData: true
    archive:
      config: Release
